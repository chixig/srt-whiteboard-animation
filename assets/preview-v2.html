<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SRT 白板动画 · Preview V2</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:#111318;color:#e8ebf0}
body{display:flex;flex-direction:column}.top{display:flex;gap:10px;align-items:center;padding:10px 14px;background:#1a1d24;border-bottom:1px solid #2b303a;flex-wrap:wrap}
button,input,select,textarea{font:inherit}button{background:#282d37;color:#eef;border:1px solid #3b4250;border-radius:6px;padding:6px 10px;cursor:pointer}button.primary{background:#2563eb;border-color:#2563eb}
button:disabled{opacity:.45}.muted{color:#8f98a6;font-size:12px}.dirty{color:#f5a623;font-weight:700}.spacer{flex:1}
.main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 340px;min-height:0}.stage{display:flex;align-items:center;justify-content:center;overflow:auto;padding:18px}
canvas{max-width:100%;max-height:calc(100vh - 150px);background:#f5ebd7;box-shadow:0 8px 40px rgba(0,0,0,.5);touch-action:none}
.side{overflow:auto;background:#1a1d24;border-left:1px solid #2b303a;padding:12px}.side h3{font-size:13px;margin:10px 0 6px}.list{list-style:none;padding:0;margin:0}.list li{display:grid;grid-template-columns:26px 44px 1fr;gap:6px;align-items:center;padding:7px;border-radius:6px;background:#232832;margin-bottom:4px;cursor:grab;font-size:12px}
.list li.sel{outline:1px solid #3b82f6;background:#17243c}.list li.drag{opacity:.35}.seq{color:#f5a623;font-weight:700}.time{color:#7fb0ff;font-variant-numeric:tabular-nums}.fields{display:grid;grid-template-columns:96px 1fr;gap:7px;align-items:center;font-size:12px}
.fields input,.fields select,.fields textarea{width:100%;background:#252a34;color:#eef;border:1px solid #3c4350;border-radius:5px;padding:5px}.fields textarea{resize:vertical}
.controls{display:flex;gap:10px;align-items:center;padding:10px 14px;background:#1a1d24;border-top:1px solid #2b303a}.controls input[type=range]{flex:1}.toast{position:fixed;bottom:58px;left:50%;transform:translateX(-50%);padding:8px 14px;border-radius:7px;background:#22c55e;color:#062;font-weight:700;opacity:0;pointer-events:none}.toast.show{opacity:1}.toast.err{background:#ef4444;color:#fff}
.badge{padding:3px 7px;border-radius:999px;background:#243044;color:#9dc1ff;font-size:11px}
@media(max-width:900px){.main{grid-template-columns:1fr}.side{border-left:0;border-top:1px solid #2b303a;max-height:44vh}}
</style>
</head>
<body>
<div class="top">
  <b>Preview V2</b><span class="badge">sequence = 唯一顺序</span>
  <button id="open" class="primary">打开场景目录</button>
  <button id="prev">‹</button><select id="scene"></select><button id="next">›</button>
  <span class="spacer"></span><span id="dirty" class="dirty"></span><button id="save">保存</button>
</div>
<div class="main">
  <div class="stage"><canvas id="c"></canvas></div>
  <aside class="side">
    <h3>自动时序</h3>
    <div class="fields">
      <label>起始延迟(ms)</label><input id="lead" type="number" min="0" step="50" value="300">
      <label>模块间隔(ms)</label><input id="gap" type="number" min="0" step="50" value="180">
      <label>结尾凝视(ms)</label><input id="gaze" type="number" min="100" step="100" value="500">
    </div>
    <p class="muted">拖动模块顺序或修改 duration 后，会立即重建 sequence/startMs，并同步时间轴。</p>
    <h3>绘制模块</h3><ul id="list" class="list"></ul>
    <h3>选中模块</h3>
    <div class="fields">
      <label>名称</label><input id="label">
      <label>x</label><input id="x" type="number">
      <label>y</label><input id="y" type="number">
      <label>宽</label><input id="w" type="number" min="1">
      <label>高</label><input id="h" type="number" min="1">
      <label>开始(ms)</label><input id="start" type="number" disabled>
      <label>时长(ms)</label><input id="dur" type="number" min="100" step="100">
      <label>结束(ms)</label><input id="end" type="number" disabled>
      <label>方向</label>
      <select id="dir"><option value="top_to_bottom">上→下</option><option value="bottom_to_top">下→上</option><option value="left_to_right">左→右</option><option value="right_to_left">右→左</option></select>
      <label>字幕</label><textarea id="sub" rows="3"></textarea>
    </div>
    <p class="muted">可直接拖动画布中的区域框移动位置；宽高用右侧字段精确调整。复杂 protectedRegions 仍可用旧版预览台编辑。</p>
  </aside>
</div>
<div class="controls">
  <button id="play">▶</button><input id="timeline" type="range" min="0" max="1000" value="0"><span id="clock" class="muted">0.00s</span>
</div>
<div id="toast" class="toast"></div>
<script>
const $=id=>document.getElementById(id), canvas=$('c'),ctx=canvas.getContext('2d'),mask=document.createElement('canvas'),mctx=mask.getContext('2d');
const canFS='showDirectoryPicker'in window, exts=['.png','.jpg','.jpeg','.webp'];
const S={dir:null,scenes:[],idx:-1,cfg:null,img:null,sel:0,time:0,playing:false,last:0,dirty:false,dragRow:-1,drag:null};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),els=()=>S.cfg?.elements||[],endMs=e=>e.reveal.startMs+e.reveal.durationMs;
let toastTimer;function toast(msg,err=false){const t=$('toast');t.textContent=msg;t.className='toast show'+(err?' err':'');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.className='toast',2200)}
function base(n){const e=exts.find(x=>n.toLowerCase().endsWith(x));return e?n.slice(0,-e.length):null}
function totalMs(){return S.cfg?.sceneDurationMs||1000}
function mark(){S.dirty=true;$('dirty').textContent='● 未保存'}
function ordered(){return els().slice().sort((a,b)=>(a.sequence||0)-(b.sequence||0))}
function retime(){
  if(!S.cfg)return;let t=Math.max(0,+$('lead').value||0),gap=Math.max(0,+$('gap').value||0),gaze=Math.max(100,+$('gaze').value||500);
  els().forEach((e,i)=>{e.sequence=i+1;e.reveal=e.reveal||{};e.reveal.startMs=Math.round(t);e.reveal.durationMs=Math.max(100,Math.round(+e.reveal.durationMs||2000));t=e.reveal.startMs+e.reveal.durationMs+gap});
  S.cfg.sceneDurationMs=Math.max(1000,Math.round(t-gap+gaze));syncFields();renderList();setTime(Math.min(S.time,totalMs()));mark()
}
$('open').onclick=async()=>{
  if(!canFS){toast('请用 Chrome / Edge 打开，V2 需要 File System Access API',true);return}
  try{S.dir=await showDirectoryPicker({mode:'readwrite'});const files={};for await(const[n,h]of S.dir.entries())if(h.kind==='file')files[n]=h;
    const names=Object.keys(files),sc=[];for(const n of names){const b=base(n);if(!b||!files[b+'.annotation.json'])continue;
      sc.push({name:b,img:files[n],ann:files[b+'.annotation.json']})}
    sc.sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));S.scenes=sc;$('scene').innerHTML=sc.map((s,i)=>`<option value="${i}">${i+1}. ${s.name}</option>`).join('');
    if(!sc.length){toast('没有找到同名 图片 + .annotation.json',true);return}load(0)
  }catch(e){if(e.name!=='AbortError')toast(e.message,true)}
};
$('scene').onchange=e=>load(+e.target.value);$('prev').onclick=()=>load(S.idx-1);$('next').onclick=()=>load(S.idx+1);
async function load(i){
  if(i<0||i>=S.scenes.length)return;pause();S.idx=i;S.sel=0;S.time=0;S.dirty=false;$('dirty').textContent='';$('scene').value=i;
  const sc=S.scenes[i];try{const [ifile,afile]=await Promise.all([sc.img.getFile(),sc.ann.getFile()]);S.cfg=JSON.parse(await afile.text());
    const url=URL.createObjectURL(ifile),img=new Image();img.onload=()=>{URL.revokeObjectURL(url);S.img=img;canvas.width=S.cfg.canvas?.width||img.naturalWidth;canvas.height=S.cfg.canvas?.height||img.naturalHeight;
      normalizeLoaded();renderList();syncFields();setTime(0)};img.src=url
  }catch(e){toast('加载失败：'+e.message,true)}
}
function normalizeLoaded(){
  S.cfg.elements=Array.isArray(S.cfg.elements)?S.cfg.elements:[];S.cfg.elements.sort((a,b)=>(a.sequence??9999)-(b.sequence??9999)||(a.reveal?.startMs??0)-(b.reveal?.startMs??0));
  els().forEach((e,i)=>{e.sequence=i+1;e.reveal=e.reveal||{startMs:0,durationMs:2000,direction:'top_to_bottom',protectedRegions:[]};e.reveal.protectedRegions=e.reveal.protectedRegions||[]});
  if(els().length){$('lead').value=Math.max(0,els()[0].reveal.startMs||0);const gaps=[];for(let i=1;i<els().length;i++)gaps.push(Math.max(0,els()[i].reveal.startMs-endMs(els()[i-1])));
    if(gaps.length)$('gap').value=Math.round(gaps.reduce((a,b)=>a+b,0)/gaps.length)}
}
function renderList(){
  $('list').innerHTML=els().map((e,i)=>`<li draggable="true" data-i="${i}" class="${i===S.sel?'sel':''}"><span class="seq">#${i+1}</span><span class="time">${(e.reveal.startMs/1000).toFixed(1)}s</span><span>${esc(e.label||e.id||'未命名')}</span></li>`).join('');
  $('list').querySelectorAll('li').forEach(li=>{const i=+li.dataset.i;li.onclick=()=>{S.sel=i;syncFields();renderList();render()};
    li.ondragstart=()=>{S.dragRow=i;li.classList.add('drag')};li.ondragend=()=>li.classList.remove('drag');li.ondragover=e=>e.preventDefault();
    li.ondrop=e=>{e.preventDefault();const from=S.dragRow,to=i;if(from===to||from<0)return;const[m]=els().splice(from,1);els().splice(to,0,m);S.sel=to;retime()}
  })
}
function syncFields(){const e=els()[S.sel],on=!!e;['label','x','y','w','h','start','dur','end','dir','sub'].forEach(id=>$(id).disabled=!on||['start','end'].includes(id));
  if(!on)return;$('label').value=e.label||'';$('x').value=Math.round(e.region.x);$('y').value=Math.round(e.region.y);$('w').value=Math.round(e.region.width);$('h').value=Math.round(e.region.height);
  $('start').value=e.reveal.startMs;$('dur').value=e.reveal.durationMs;$('end').value=endMs(e);$('dir').value=e.reveal.direction||'top_to_bottom';$('sub').value=e.subtitle||''
}
function apply(){
  const e=els()[S.sel];if(!e)return;const W=canvas.width,H=canvas.height;e.label=$('label').value;e.region.x=clamp(Math.round(+$('x').value||0),0,W-1);e.region.y=clamp(Math.round(+$('y').value||0),0,H-1);
  e.region.width=clamp(Math.round(+$('w').value||1),1,W-e.region.x);e.region.height=clamp(Math.round(+$('h').value||1),1,H-e.region.y);e.reveal.durationMs=Math.max(100,Math.round(+$('dur').value||100));
  e.reveal.direction=$('dir').value;e.subtitle=$('sub').value;retime();render()
}
['label','x','y','w','h','dur','dir','sub'].forEach(id=>$(id).addEventListener('input',apply));['lead','gap','gaze'].forEach(id=>$(id).addEventListener('input',retime));
function progress(t,e){return clamp((t-e.reveal.startMs)/e.reveal.durationMs,0,1)}
function revealRect(e,p){const r=e.region,d=e.reveal.direction;if(d==='left_to_right')return[r.x,r.y,r.width*p,r.height];if(d==='right_to_left')return[r.x+r.width*(1-p),r.y,r.width*p,r.height];
  if(d==='bottom_to_top')return[r.x,r.y+r.height*(1-p),r.width,r.height*p];return[r.x,r.y,r.width,r.height*p]}
function render(){
  if(!S.cfg||!S.img)return;const W=canvas.width,H=canvas.height;ctx.fillStyle='#f5ebd7';ctx.fillRect(0,0,W,H);const arr=ordered();
  if(!S.playing&&S.time===0){ctx.drawImage(S.img,0,0,W,H)}else{mask.width=W;mask.height=H;mctx.clearRect(0,0,W,H);
    arr.forEach((e,i)=>{const p=progress(S.time,e);if(p<=0)return;const[x,y,w,h]=revealRect(e,p);mctx.save();mctx.beginPath();mctx.rect(x,y,w,h);mctx.clip();mctx.drawImage(S.img,0,0,W,H);mctx.restore();
      mctx.save();mctx.globalCompositeOperation='destination-out';arr.slice(i+1).forEach(l=>mctx.fillRect(l.region.x,l.region.y,l.region.width,l.region.height));(e.reveal.protectedRegions||[]).forEach(r=>mctx.fillRect(r.x,r.y,r.width,r.height));mctx.restore()});
    ctx.drawImage(mask,0,0)}
  arr.forEach((e,i)=>{const r=e.region;ctx.save();ctx.strokeStyle=i===S.sel?'#3b82f6':'#e97036';ctx.lineWidth=i===S.sel?4:2;ctx.strokeRect(r.x,r.y,r.width,r.height);ctx.fillStyle=ctx.strokeStyle;ctx.font=`${Math.max(14,W/70)}px sans-serif`;ctx.fillText(String(i+1),r.x+6,r.y+20);ctx.restore()})
}
function point(ev){const b=canvas.getBoundingClientRect();return{x:(ev.clientX-b.left)*canvas.width/b.width,y:(ev.clientY-b.top)*canvas.height/b.height}}
canvas.onpointerdown=ev=>{const p=point(ev);for(let i=els().length-1;i>=0;i--){const r=els()[i].region;if(p.x>=r.x&&p.x<=r.x+r.width&&p.y>=r.y&&p.y<=r.y+r.height){S.sel=i;S.drag={p,base:{...r}};canvas.setPointerCapture(ev.pointerId);syncFields();renderList();return}}};
canvas.onpointermove=ev=>{if(!S.drag)return;const p=point(ev),e=els()[S.sel],r=e.region,dx=p.x-S.drag.p.x,dy=p.y-S.drag.p.y;r.x=clamp(Math.round(S.drag.base.x+dx),0,canvas.width-r.width);r.y=clamp(Math.round(S.drag.base.y+dy),0,canvas.height-r.height);syncFields();mark();render()};
canvas.onpointerup=()=>S.drag=null;
function setTime(v){S.time=clamp(v,0,totalMs());$('timeline').value=totalMs()?Math.round(S.time/totalMs()*1000):0;$('clock').textContent=`${(S.time/1000).toFixed(2)} / ${(totalMs()/1000).toFixed(2)}s`;render()}
$('timeline').oninput=e=>{pause();setTime(+e.target.value/1000*totalMs())};$('play').onclick=()=>S.playing?pause():play();
function play(){if(!S.cfg)return;if(S.time>=totalMs())S.time=0;S.playing=true;$('play').textContent='⏸';S.last=performance.now();requestAnimationFrame(tick)}
function pause(){S.playing=false;$('play').textContent='▶'}
function tick(ts){if(!S.playing)return;const dt=ts-S.last;S.last=ts;setTime(S.time+dt);if(S.time>=totalMs()){pause();return}requestAnimationFrame(tick)}
$('save').onclick=async()=>{if(!S.cfg||S.idx<0)return;retime();try{const h=S.scenes[S.idx].ann;if(h.requestPermission){const p=await h.requestPermission({mode:'readwrite'});if(p!=='granted')throw Error('未授权写入')}
  const w=await h.createWritable();await w.write(JSON.stringify(S.cfg,null,2));await w.close();S.dirty=false;$('dirty').textContent='';toast('已保存并同步 sequence/startMs')}catch(e){toast('保存失败：'+e.message,true)}};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
render();
</script>
</body>
</html>
