name: tests

on:
  push:
    branches: [main, agent/short-video-upgrade]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile upgraded scripts
        run: >-
          python -m py_compile
          scripts/annotation_tools.py
          scripts/mux_audio.py
          scripts/parse_srt.py
          scripts/render_annotation_preview.py
          scripts/render_project.py
          scripts/render_short_video.py
          scripts/prepare_env.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
