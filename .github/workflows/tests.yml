name: tests

on:
  push:
    branches: [main, agent/short-video-upgrade]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg runtime
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install runtime test dependencies
        run: python -m pip install --quiet numpy opencv-python-headless
      - name: Verify ffmpeg filters
        run: |
          ffmpeg -hide_banner -filters | grep -q sidechaincompress
          ffmpeg -hide_banner -filters | grep -q ' ass '
      - name: Compile upgraded scripts
        run: >-
          python -m py_compile
          scripts/annotation_tools.py
          scripts/assemble_media.py
          scripts/audio_mix.py
          scripts/burn_subtitles.py
          scripts/media_utils.py
          scripts/mux_audio.py
          scripts/parse_srt.py
          scripts/polygon_schema.py
          scripts/polygon_renderer.py
          scripts/render_annotation_preview.py
          scripts/render_preview.py
          scripts/render_project.py
          scripts/render_short_video.py
          scripts/sfx_plan.py
          scripts/subtitle_ass.py
          scripts/suggest_regions.py
          scripts/prepare_env.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
